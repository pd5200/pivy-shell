name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.12.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Show build environment
        run: |
          swift --version
          xcodebuild -version

      - name: Build universal app
        run: BUILD_UNIVERSAL=1 ./build.sh

      - name: Verify app bundle
        run: |
          test -x PivyShell.app/Contents/MacOS/PivyShell
          test -f PivyShell.app/Contents/Info.plist
          lipo -info PivyShell.app/Contents/MacOS/PivyShell
          plutil -p PivyShell.app/Contents/Info.plist

      - name: Package app
        id: package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          archive="PivyShell-${version}-macOS-universal.zip"
          checksum="${archive}.sha256"

          ditto -c -k --sequesterRsrc --keepParent PivyShell.app "$archive"
          shasum -a 256 "$archive" > "$checksum"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "${{ steps.package.outputs.archive }}" \
              "${{ steps.package.outputs.checksum }}" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "PivyShell $RELEASE_TAG" \
              --generate-notes \
              "${{ steps.package.outputs.archive }}" \
              "${{ steps.package.outputs.checksum }}"
          fi
